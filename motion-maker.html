<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三秒卡片動畫工具</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf1e6;color:#30241d;font:16px/1.55 system-ui,sans-serif}main{max-width:820px;margin:auto;padding:24px 18px 48px}h1{margin:.2em 0}p{margin:.5em 0 1em}.layout{display:grid;grid-template-columns:1fr 270px;gap:22px;align-items:start}section{background:#fffaf3;border:1px solid #e5cdb8;border-radius:18px;padding:18px}label{display:block;font-weight:650;margin:10px 0 4px}input,select,button{font:inherit}input,select{width:100%;padding:9px;border:1px solid #ad9685;border-radius:8px;background:white;color:inherit}button,.download{display:inline-block;border:0;border-radius:8px;background:#a93618;color:white;padding:10px 14px;margin:10px 5px 0 0;text-decoration:none;cursor:pointer}button:disabled{opacity:.6}canvas{display:block;width:100%;height:auto;border-radius:13px}a{color:#9a3016}[hidden]{display:none!important}@media(max-width:620px){.layout{grid-template-columns:1fr}canvas{max-width:250px;margin:auto}}
</style>
<main>
<a href="ai-motion-prompts.html">← 回提示詞教學</a>
<h1>做一支 3 秒卡片動畫</h1>
<p>有範例文字，可以直接按預覽。想換主題時再改下面三欄。</p>
<details><summary>第一次來？照這三步</summary><ol><li>先按「播放預覽」，看範例怎麼動。</li><li>點任一輸入框，刪掉範例文字，換成自己的，再播一次。</li><li>按「產生可下載影片」，等按鈕變成「下載 MP4」或「下載 WebM」，再按一次。檔案可從瀏覽器的下載紀錄打開。</li></ol><p>如果從 IG 裡打開時無法下載，用右上角選單改到 Safari 或 Chrome 開啟。</p></details>
<p><a href="first-motion-demo.mp4">直接播放範例 MP4</a> · <a href="first-motion-demo.mp4" download>下載範例 MP4</a></p>
<div class="layout">
<section aria-label="動畫設定">
<label for="title">中間卡片</label><input id="title" maxlength="10" value="一個好點子">
<label for="left">左邊卡片</label><input id="left" maxlength="8" value="拆成步驟">
<label for="right">右邊卡片</label><input id="right" maxlength="8" value="馬上試做">
<label for="speed">展開速度</label><select id="speed"><option value="1.15">慢慢展開</option><option value=".55">快速展開</option></select>
<button id="preview" type="button">播放預覽</button>
<button id="export" type="button">產生可下載影片</button>
<button id="reset" type="button">恢復範例</button>
<a id="save" class="download" hidden>下載影片</a>
<p id="status" role="status" aria-live="polite">影片是 9:16 直式、3 秒、無聲。</p>
</section>
<canvas id="canvas" width="720" height="1280" role="img" aria-label="橘色卡片動畫預覽"></canvas>
</div></main>
<script>
const byId = id => document.getElementById(id);
const canvas = byId('canvas');
const ctx = canvas.getContext('2d');
const status = byId('status');
const preview = byId('preview');
const exportButton = byId('export');
const save = byId('save');
const reset = byId('reset');
const controls = ['title', 'left', 'right', 'speed'].map(byId);
let active = false;
let downloadUrl;
function render(time) {
  const ease = n => {const x = Math.max(0, Math.min(1, n)); return x*x*(3-2*x)};
  const slide = ease(time/.65);
  const open = ease((time-.75)/Number(byId('speed').value));
  ctx.fillStyle = '#fbf0e3';
  ctx.fillRect(0, 0, 720, 1280);
  ctx.fillStyle = '#ead4bf';
  for(let x=27;x<720;x+=29) for(let y=29;y<1280;y+=29) ctx.fillRect(x,y,2,2);
  const y = 475 + (1-slide)*820;
  const cards = [
    [-1, byId('left').value, '#f2a77b'],
    [1, byId('right').value, '#f2a77b'],
    [0, byId('title').value, '#ad3e21']
  ];
  for(const [side,word,color] of cards) {
    const x=360 + side*211*open;
    const cardY=y+Math.abs(side)*53*open;
    const width=side===0 ? 266 : 200;
    ctx.globalAlpha=side===0 ? 1 : open;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.roundRect(x-width/2,cardY,width,260,24);
    ctx.fill();
    ctx.fillStyle=side===0 ? '#fff9eb' : '#40251a';
    ctx.font= side===0 ? '700 26px system-ui' : '700 23px system-ui';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(word,x,cardY+127,width-22);
  }
  ctx.globalAlpha=1;
}
async function play() {
  await new Promise(resolve => {
    const start = performance.now();
    function tick(now) {
      const elapsed = (now-start)/1000;
      render(Math.min(3,elapsed));
      if(elapsed < 3) requestAnimationFrame(tick);
      else resolve();
    }
    requestAnimationFrame(tick);
  });
}
function lock(value) {
  active=value;
  for(const button of [preview,exportButton,reset,...controls]) button.disabled=value;
}
reset.onclick=()=> {
  for (const field of controls) field.value=field.tagName==='SELECT' ? field.options[0].value : field.defaultValue;
  save.hidden=true;
  status.textContent='範例已恢復。可以重新播放。';
  render(3);
};
preview.onclick=async ()=> {
  lock(true);
  status.textContent='播放中…';
  await play();
  status.textContent='預覽完成。可以再調速度，或下載影片。';
  lock(false);
};
for(const control of controls) control.addEventListener('input', () => {
  if(!active) render(3);
  save.hidden=true;
});
exportButton.onclick=async ()=> {
  if(typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
    status.textContent='這個瀏覽器無法錄製，請用電腦開最新版 Chrome 或 Edge 再試。';
    return;
  }
  save.hidden=true;
  lock(true);
  let stream;
  try {
    stream=canvas.captureStream(30);
    let recorder;
    for(const type of ['video/mp4;codecs=avc1.42001e','video/mp4','video/webm;codecs=vp8','video/webm']) {
      if(!MediaRecorder.isTypeSupported(type)) continue;
      try {recorder = new MediaRecorder(stream,{mimeType:type}); break} catch {}
    }
    if(!recorder) throw Error('Unsupported video');
    const chunks=[];
    const output=new Promise((resolve,reject) => {
      recorder.ondataavailable=e=>{if(e.data.size) chunks.push(e.data)};
      recorder.onstop=()=>resolve(new Blob(chunks,{type:recorder.mimeType}));
      recorder.onerror=reject;
    });
    const animation=async ()=> {
      render(0);
      recorder.start();
      await play();
      if(recorder.state !== 'inactive') recorder.stop();
    };
    status.textContent='正在產生影片，請讓這個分頁保持開啟…';
    const [file]=await Promise.all([output,animation()]);
    if(!file.size) throw Error('Empty recording');
    if(downloadUrl) URL.revokeObjectURL(downloadUrl);
    downloadUrl=URL.createObjectURL(file);
    const extension=file.type.includes('mp4') ? 'mp4' : 'webm';
    save.href=downloadUrl;
    save.download='first-motion.'+extension;
    save.textContent='下載 '+extension.toUpperCase();
    save.hidden=false;
    status.textContent=extension==='mp4' ? '影片已完成，點「下載 MP4」。' : '這個瀏覽器輸出的是 WebM。要 MP4，可用支援 MP4 錄製的瀏覽器再開這頁。';
  } catch {
    status.textContent='這次沒有錄成功。請重新整理頁面，或用電腦版 Chrome、Edge 再試。';
  } finally {
    if(stream) for(const track of stream.getTracks()) track.stop();
    lock(false);
  }
};
render(3);
</script>
</html>
